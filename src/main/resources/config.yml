#  ImageOnMapReborn – konfiguracja / configuration
#  Opcje wspólne z ImageOnMap mają te same nazwy i przy pierwszym uruchomieniu
#  są kopiowane z plugins/ImageOnMap/config.yml.

# Język pluginu: pl-PL lub en-US. Pusty = język systemu.
# Pliki tłumaczeń są w plugins/ImageOnMapReborn/lang/ i można je edytować
# (albo dodać nowy język, np. de_DE.yml).
lang: pl-PL

# true = wiadomości i GUI w języku klienta gracza (jeśli jest takie tłumaczenie),
# false = zawsze język z opcji "lang".
per-player-language: false

# Każdy obraz zużywa mapy Minecrafta (ID). Limit liczby map na cały serwer
# i na jednego gracza. 0 = bez limitu.
# Limit można też dać uprawnieniem: imageonmap.maplimit.<liczba> i imageonmap.imagelimit.<liczba>.
map-global-limit: 0
map-player-limit: 0

# Maksymalny rozmiar obrazka źródłowego w pikselach. 0 = bez limitu.
limit-map-size-x: 0
limit-map-size-y: 0

# Czy zapisywać też pełny obraz (images/_<pierwsza>-<ostatnia>.png).
save-full-image: false

# Lista dozwolonych stron z obrazkami. Pusta = wszystkie.
# Uwaga: jak w ImageOnMap, uprawnienie imageonmap.bypasswhitelist (domyślnie dla wszystkich)
# pomija tę listę – żeby ją wymusić, odbierz to uprawnienie (np. w LuckPerms ustaw false).
# Można użyć *.domena.pl dla wszystkich subdomen.
# images-hostnames-whitelist:
#   - i.imgur.com
#   - cdn.discordapp.com
images-hostnames-whitelist: []

download:
  # Limit czasu połączenia i odczytu (sekundy).
  timeout-seconds: 20
  # Maksymalny rozmiar pobieranego pliku (MB).
  max-size-mb: 25
  # Blokuje linki do adresów w sieci lokalnej (127.0.0.1, 192.168.x.x itd.),
  # żeby gracze nie mogli przez serwer odpytywać wewnętrznych usług.
  block-private-addresses: true
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 ImageOnMapReborn"

# Maksymalna liczba pikseli obrazu (szerokość x wysokość) – chroni RAM serwera.
# 40 000 000 to ok. 6300 x 6300 px. Dotyczy też docelowego rozmiaru plakatu.
max-image-pixels: 40000000

# true = płynne skalowanie przy zmniejszaniu (lepsze zdjęcia),
# false = skalowanie "piksel w piksel" jak w starym ImageOnMap.
smooth-scaling: true

# Chroni ramki z obrazami przed mobami, strzałami i wybuchami
# (zdjąć mapę może tylko gracz).
protect-item-frames: true

legacy-import:
  # Automatyczny jednorazowy import danych ze starego ImageOnMap przy pierwszym starcie.
  # Po imporcie powstaje plik legacy-import.yml. Ponowny import: /maptool import
  enabled: true
  # Nazwa folderu starego pluginu w katalogu plugins/.
  folder: ImageOnMap
