command:
  help:
    header: "&6ImageOnMapReborn &7v{0} &8– &7verfügbare Befehle:"
    entry: "&f{0} &8– &7{1}"
  new:
    usage: "/tomap <Link|file:Name> [resize|resize-stretched|resize-covered] [Breite Höhe] [dither|nodither]"
    description: "macht aus einem Bild aus dem Internet Karten"
    no-url: "&cBitte gib den Link eines Bildes an."
    invalid-mode: "&cUnbekannter Modus. Wähle resize, resize-stretched oder resize-covered."
    invalid-size: "&cGib die Größe in Karten als zwei Zahlen an (4 3), oder als 4x3 bzw. 4*3."
  list:
    usage: "/maptool list [Spieler]"
    description: "zeigt die Bilder (klicke eins an, um es zu bekommen)"
    none: "&7Es gibt noch keine Bilder."
    header:
      one: "&f&l{0} Bild:"
      other: "&f&l{0} Bilder:"
    hover: "&a&l{0}\n&7{1}, {2}\n\n&7Klicken, um es zu bekommen"
    console-entry: "&f{0} &7– {1} ({2})"
    parts: "{0} Teile"
  get:
    usage: "/maptool get [Spieler:]<Kartenname>"
    description: "gibt dir eine Kopie eines deiner Bilder"
  getremaining:
    usage: "/maptool getremaining"
    description: "gibt die Karten aus, die nicht in dein Inventar gepasst haben"
    none: "&7Es wartet nichts auf dich."
    inventory-full: "&cMach zuerst etwas Platz im Inventar frei."
    remaining:
      one: "&7Es wartet noch {0} Karte."
      other: "&7Es warten noch {0} Karten."
    done: "&aDu hast alles abgeholt."
  explore:
    usage: "/maps [Spieler]"
    description: "öffnet die Bildergalerie"
  give:
    usage: "/givemap <Spieler> [Besitzer:]<Kartenname>"
    description: "gibt einem Spieler ein Bild"
    success: "&a{1} hat &6{0}&a erhalten."
  rename:
    usage: "/maptool rename [Spieler:]<Kartenname> <neuer Name>"
    description: "ändert den Namen eines Bildes"
    quotes-hint: "&7Setze Namen mit Leerzeichen in Anführungszeichen: &f/maptool rename \"Alter Name\" \"Neuer Name\""
    invalid-name: "&cDer Name darf nicht leer sein."
    success: "&aDas Bild heißt jetzt &6{0}&a (ID: {1})."
    prompt: "&eSchreibe den neuen Namen für &6{0}&e in den Chat, oder &fabbrechen&e, um ihn zu behalten."
    cancelled: "&7Der Name wurde nicht geändert."
  update:
    usage: "/maptool update [Spieler:]<Kartenname> <neuer Link|file:Name> [stretched|covered] [dither|nodither]"
    description: "zeichnet ein anderes Bild auf dieselben Karten"
    invalid-mode: "&cUnbekannter Modus. Benutze stretched oder covered, oder nichts, um die Proportionen zu behalten."
  delete:
    usage: "/maptool delete [Spieler:]<Kartenname>"
    description: "löscht ein Bild endgültig"
    confirm-prompt: "&f&6{0}&f löschen?"
    confirm-button: "&c&l[Ja, löschen]"
    confirm-hover: "&cDas Bild und seine Karten können danach nicht wiederhergestellt werden."
    confirm-console: "&fUm &6{0}&f wirklich zu löschen, führe aus: &e{1}"
    success: "&aDas Bild wurde gelöscht."
  import:
    usage: "/maptool import [Ordner]"
    description: "importiert die Bilder des alten ImageOnMap erneut"
    start: "&7ImageOnMap-Daten werden aus &f{0}&7 gelesen..."
    not-found: "&cIn {0} gibt es keine ImageOnMap-Daten."
    result: "&aImport abgeschlossen: {0} Spielerdateien gelesen, {1} Bilder ({2} Karten) hinzugefügt, {3} bereits bekannt, {4} Bilddateien kopiert, {5} Fehler."
  reload:
    usage: "/maptool reload"
    description: "lädt config.yml und die Nachrichten neu"
    done: "&aEinstellungen und Nachrichten neu geladen."
  info:
    usage: "/maptool info"
    description: "zeigt die Version, den Update-Status und Statistiken"
    header: "&8&m        &r &bImageOnMap&3Reborn &f{0} &8&m        "
    author: "&7Autor: &f{0}"
    images: "&7Bilder: &f{0} &7(Karten: {1}, Spieler: {2})"
    uploads: "&7Bilder im Upload-Ordner: &f{0} &8(/tomap file:<Name>)"
    limits: "&7Kartenlimits: &f{0} &7pro Spieler, &f{1} &7auf dem Server"
    language: "&7Sprache: &f{0}"
    server: "&7Server: &f{0}"
