update:
  available: "&eВышла новая версия ImageOnMapReborn: &f{0}&e (на этом сервере &f{1}&e)."
  download: "&eСкачать можно здесь: &f{0}"

command:
  help:
    header: "&6ImageOnMapReborn &7v{0} &8– &7доступные команды:"
    entry: "&f{0} &8– &7{1}"
  new:
    usage: "/tomap <ссылка|file:название> [resize|resize-stretched|resize-covered] [ширина высота] [dither|nodither]"
    description: "превращает изображение из интернета в карты"
    no-url: "&cУкажите ссылку на изображение."
    invalid-mode: "&cНеизвестный режим. Выберите resize, resize-stretched или resize-covered."
    invalid-size: "&cУкажите размер в картах двумя числами (4 3) или в виде 4x3 или 4*3."
  list:
    usage: "/maptool list [игрок]"
    description: "показывает изображения (нажмите на одно, чтобы получить его)"
    none: "&7Изображений пока нет."
    header:
      one: "&f&l{0} изображение:"
      few: "&f&l{0} изображения:"
      many: "&f&l{0} изображений:"
    hover: "&a&l{0}\n&7{1}, {2}\n\n&7Нажмите, чтобы получить"
    console-entry: "&f{0} &7– {1} ({2})"
    parts: "частей: {0}"
  get:
    usage: "/maptool get [игрок:]<название карты>"
    description: "выдаёт копию одного из ваших изображений"
  getremaining:
    usage: "/maptool getremaining"
    description: "выдаёт карты, которые не поместились в инвентарь"
    none: "&7Вас ничего не ждёт."
    inventory-full: "&cСначала освободите место в инвентаре."
    remaining:
      one: "&7Вас ещё ждёт {0} карта."
      few: "&7Вас ещё ждут {0} карты."
      many: "&7Вас ещё ждут {0} карт."
    done: "&aВы забрали всё."
  explore:
    usage: "/maps [игрок]"
    description: "открывает обзор изображений"
  give:
    usage: "/givemap <игрок> [владелец:]<название карты>"
    description: "выдаёт изображение игроку"
    success: "&a{1} получил(а) &6{0}&a."
  rename:
    usage: "/maptool rename [игрок:]<название карты> <новое название>"
    description: "меняет название изображения"
    quotes-hint: "&7Названия с пробелами пишите в кавычках: &f/maptool rename \"Старое название\" \"Новое название\""
    invalid-name: "&cНазвание не может быть пустым."
    success: "&aТеперь изображение называется &6{0}&a (ID: {1})."
    prompt: "&eНапишите в чат новое название для &6{0}&e или &fотмена&e, чтобы оставить старое."
    cancelled: "&7Название не изменено."
  update:
    usage: "/maptool update [игрок:]<название карты> <новая ссылка|file:название> [stretched|covered] [dither|nodither]"
    description: "рисует другое изображение на тех же картах"
    invalid-mode: "&cНеизвестный режим. Используйте stretched или covered, или ничего, чтобы сохранить пропорции."
  delete:
    usage: "/maptool delete [игрок:]<название карты>"
    description: "удаляет изображение навсегда"
    confirm-prompt: "&fУдалить &6{0}&f?"
    confirm-button: "&c&l[Да, удалить]"
    confirm-hover: "&cИзображение и его карты потом нельзя будет восстановить."
    confirm-console: "&fЧтобы действительно удалить &6{0}&f, выполните: &e{1}"
    success: "&aИзображение удалено."
  import:
    usage: "/maptool import [папка]"
    description: "заново импортирует изображения старого ImageOnMap"
    start: "&7Читаем данные ImageOnMap из &f{0}&7..."
    not-found: "&cВ {0} нет данных ImageOnMap."
    result: "&aИмпорт завершён: прочитано файлов игроков – {0}, добавлено изображений – {1} (карт – {2}), уже известных – {3}, скопировано файлов изображений – {4}, ошибок – {5}."
  reload:
    usage: "/maptool reload"
    description: "перезагружает config.yml и сообщения"
    done: "&aНастройки и сообщения перезагружены."
  info:
    usage: "/maptool info"
    description: "показывает версию, состояние обновлений и статистику"
    header: "&8&m        &r &bImageOnMap&3Reborn &f{0} &8&m        "
    author: "&7Автор: &f{0}"
    images: "&7Изображения: &f{0} &7(карты: {1}, игроки: {2})"
    uploads: "&7Изображения в папке upload: &f{0} &8(/tomap file:<название>)"
    limits: "&7Лимиты карт: &f{0} &7на игрока, &f{1} &7на сервер"
    language: "&7Язык: &f{0}"
    server: "&7Сервер: &f{0}"
    update-off: "&7Обновления: &8проверка отключена"
    update-unknown: "&7Обновления: &8ещё не проверялись"
    update-latest: "&7Обновления: &aустановлена последняя версия"
    update-newer: "&7Обновления: &aэта сборка новее последнего релиза ({0})"
    update-available: "&7Обновления: &eвышла версия &f{0}&e &8- &f{1}"

