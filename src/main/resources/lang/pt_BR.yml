  animation-too-heavy: "&eEste GIF tem muitos quadros grandes para ser animado, então só o primeiro quadro é usado."

error:
  invalid-url: "esse link não parece válido."
  unsupported-protocol: "só funcionam links que começam com http:// ou https://."
  untrusted-host: "imagens deste site não são permitidas aqui. Pergunte a um administrador se você acha que deveriam ser."
