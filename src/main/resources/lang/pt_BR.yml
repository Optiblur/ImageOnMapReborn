  image-too-wide: "a imagem é mais larga que os {0} px permitidos."
  image-too-tall: "a imagem é mais alta que os {0} px permitidos."
  image-too-big: "uma imagem de {0} × {1} px é grande demais para processar."
  poster-too-big: "um pôster de {0} × {1} mapas seria grande demais."
