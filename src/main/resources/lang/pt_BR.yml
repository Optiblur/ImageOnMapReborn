  download-too-large: "o arquivo é maior que o limite de {0} MB."
  timeout: "o site demorou demais para responder."
  download-failed: "o download não funcionou ({0})."
  not-an-image: "o link não aponta para uma imagem PNG, JPEG, GIF, BMP ou WebP."
