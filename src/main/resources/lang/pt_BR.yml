# ImageOnMapReborn – Brazilian Portuguese messages.
# Color codes: &a, &c... (and &#RRGGBB). Placeholders: {0}, {1}...
# Keys missing from this file are taken from the version bundled with the plugin.

general:
  no-permission: "&cVocê não tem permissão para fazer isso."
  player-only: "&cSó jogadores podem usar este comando."
  player-not-found: "&cNenhum jogador chamado {0} foi encontrado."
  player-not-online: "&c{0} não está online agora."
  map-not-found: "&cNenhuma imagem com esse nome foi encontrada."
  owner-required: "&cPelo console, informe também o dono: <jogador>:<nome do mapa>."
  unknown-subcommand: "&cEsse subcomando não existe. Tente &f/{0} help&c."
  usage: "&cComo usar: &f{0}"
  no-longer-allowed: "&cSuas permissões mudaram, esta ação não está mais disponível."
  inventory-overflow: "&eSeu inventário está cheio, então alguns mapas estão esperando por você. Use &f/maptool getremaining&e para pegá-los."
  internal-error: "&cAlgo deu errado no servidor, os detalhes estão no console."

map:
  default-name: "Mapa"

item:
  single:
    name: "&6{0}"
  part:
    name-grid: "&6{0} &7[linha {1}, col. {2}]"
    name-index: "&6{0} &7[pedaço {1}]"
  splatter:
    name: "&6{0} &8| &ePôster &7{1}×{2}"
    lore:
      - "&8ID: {0}"
      - ""
      - "&9Tamanho"
      - "&7{1} de largura, {2} de altura – {3} molduras"
      - ""
      - "&9Como pendurar"
      - "&7Coloque molduras vazias em uma parede,"
      - "&7chão ou teto, tantas quanto o tamanho"
      - "&7acima. Clique com o botão direito na de"
      - "&7baixo à esquerda segurando este item."
      - ""
      - "&9Como tirar"
      - "&7Agache e bata em qualquer um dos mapas."

render:
  busy: "&cEspere, sua imagem anterior ainda está sendo processada."
  started: "&2Preparando sua imagem..."
  finished: "&2Sua imagem está pronta!"
  failed: "&cNão foi possível criar o mapa: {0}"
  update-started: "&2Substituindo a imagem..."
  update-finished: "&2A nova imagem agora aparece nos mapas."
  finished-animated: "&2Sua imagem animada está pronta! &7({0} quadros)"
  update-finished-animated: "&2A nova animação agora roda nos mapas. &7({0} quadros)"
