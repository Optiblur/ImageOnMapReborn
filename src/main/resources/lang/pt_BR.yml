  download: "&eBaixe aqui: &f{0}"

command:
  help:
    header: "&6ImageOnMapReborn &7v{0} &8– &7comandos disponíveis:"
    entry: "&f{0} &8– &7{1}"
  new:
    usage: "/tomap <link|file:nome> [resize|resize-stretched|resize-covered] [largura altura] [dither|nodither]"
    description: "transforma uma imagem da internet em mapas"
    no-url: "&cInforme o link de uma imagem."
    invalid-mode: "&cModo desconhecido. Escolha resize, resize-stretched ou resize-covered."
    invalid-size: "&cInforme o tamanho em mapas com dois números (4 3), ou como 4x3 ou 4*3."
  list:
    usage: "/maptool list [jogador]"
    description: "mostra as imagens (clique em uma para recebê-la)"
    none: "&7Ainda não há imagens."
    header:
      one: "&f&l{0} imagem:"
      other: "&f&l{0} imagens:"
    hover: "&a&l{0}\n&7{1}, {2}\n\n&7Clique para recebê-la"
    console-entry: "&f{0} &7– {1} ({2})"
    parts: "{0} pedaços"
  get:
    usage: "/maptool get [jogador:]<nome do mapa>"
    description: "dá a você uma cópia de uma das suas imagens"
  getremaining:
    usage: "/maptool getremaining"
    description: "entrega os mapas que não couberam no seu inventário"
    none: "&7Nada está esperando por você."
    inventory-full: "&cLibere espaço no inventário primeiro."
    remaining:
      one: "&7Ainda há {0} mapa esperando."
      other: "&7Ainda há {0} mapas esperando."
    done: "&aVocê pegou tudo."
  explore:
    usage: "/maps [jogador]"
    description: "abre o navegador de imagens"
  give:
    usage: "/givemap <jogador> [dono:]<nome do mapa>"
    description: "entrega uma imagem a um jogador"
    success: "&a{1} recebeu &6{0}&a."
  rename:
    usage: "/maptool rename [jogador:]<nome do mapa> <novo nome>"
    description: "muda o nome de uma imagem"
    quotes-hint: "&7Use aspas em nomes com espaços: &f/maptool rename \"Nome antigo\" \"Nome novo\""
    invalid-name: "&cO nome não pode ficar vazio."
    success: "&aA imagem agora se chama &6{0}&a (ID: {1})."
    prompt: "&eEscreva no chat o novo nome para &6{0}&e, ou &fcancelar&e para mantê-lo."
    cancelled: "&7O nome não foi alterado."
  update:
    usage: "/maptool update [jogador:]<nome do mapa> <novo link|file:nome> [stretched|covered] [dither|nodither]"
    description: "desenha outra imagem nos mesmos mapas"
    invalid-mode: "&cModo desconhecido. Use stretched ou covered, ou nada para manter as proporções."
  delete:
    usage: "/maptool delete [jogador:]<nome do mapa>"
    description: "apaga uma imagem de vez"
    confirm-prompt: "&fApagar &6{0}&f?"
    confirm-button: "&c&l[Sim, apagar]"
    confirm-hover: "&cA imagem e seus mapas não poderão ser recuperados depois."
    confirm-console: "&fPara apagar &6{0}&f de verdade, execute: &e{1}"
    success: "&aA imagem foi apagada."
  import:
    usage: "/maptool import [pasta]"
    description: "importa de novo as imagens do antigo ImageOnMap"
    start: "&7Lendo os dados do ImageOnMap de &f{0}&7..."
    not-found: "&cNão há dados do ImageOnMap em {0}."
    result: "&aImportação concluída: {0} arquivos de jogadores lidos, {1} imagens ({2} mapas) adicionadas, {3} já conhecidas, {4} arquivos de imagem copiados, {5} erros."
  reload:
    usage: "/maptool reload"
    description: "recarrega o config.yml e as mensagens"
    done: "&aConfigurações e mensagens recarregadas."
  info:
    usage: "/maptool info"
    description: "mostra a versão, o status de atualização e estatísticas"
    header: "&8&m        &r &bImageOnMap&3Reborn &f{0} &8&m        "
    author: "&7Autor: &f{0}"
    images: "&7Imagens: &f{0} &7(mapas: {1}, jogadores: {2})"
    uploads: "&7Imagens na pasta upload: &f{0} &8(/tomap file:<nome>)"
    limits: "&7Limites de mapas: &f{0} &7por jogador, &f{1} &7no servidor"
    language: "&7Idioma: &f{0}"
    server: "&7Servidor: &f{0}"
    update-off: "&7Atualizações: &8a verificação está desligada"
    update-unknown: "&7Atualizações: &8ainda não verificadas"
    update-latest: "&7Atualizações: &aem dia"
    update-newer: "&7Atualizações: &aesta build é mais nova que a última versão ({0})"
    update-available: "&7Atualizações: &esaiu a versão &f{0}&e &8- &f{1}"

