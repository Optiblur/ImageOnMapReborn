command:
  help:
    header: "&6ImageOnMapReborn &7v{0} &8– &7comandos disponibles:"
    entry: "&f{0} &8– &7{1}"
  new:
    usage: "/tomap <enlace|file:nombre> [resize|resize-stretched|resize-covered] [ancho alto] [dither|nodither]"
    description: "convierte una imagen de internet en mapas"
    no-url: "&cIndica el enlace de una imagen."
    invalid-mode: "&cModo desconocido. Elige resize, resize-stretched o resize-covered."
    invalid-size: "&cIndica el tamaño en mapas con dos números (4 3), o como 4x3 o 4*3."
  list:
    usage: "/maptool list [jugador]"
    description: "muestra las imágenes (haz clic en una para recibirla)"
    none: "&7Todavía no hay imágenes."
    header:
      one: "&f&l{0} imagen:"
      other: "&f&l{0} imágenes:"
    hover: "&a&l{0}\n&7{1}, {2}\n\n&7Haz clic para recibirla"
    console-entry: "&f{0} &7– {1} ({2})"
    parts: "{0} piezas"
  get:
    usage: "/maptool get [jugador:]<nombre del mapa>"
    description: "te da una copia de una de tus imágenes"
  getremaining:
    usage: "/maptool getremaining"
    description: "entrega los mapas que no cupieron en tu inventario"
    none: "&7No te espera nada."
    inventory-full: "&cPrimero libera espacio en tu inventario."
    remaining:
      one: "&7Todavía te espera {0} mapa."
      other: "&7Todavía te esperan {0} mapas."
    done: "&aLo has recogido todo."
  explore:
    usage: "/maps [jugador]"
    description: "abre el explorador de imágenes"
  give:
    usage: "/givemap <jugador> [dueño:]<nombre del mapa>"
    description: "entrega una imagen a un jugador"
    success: "&a{1} ha recibido &6{0}&a."
  rename:
    usage: "/maptool rename [jugador:]<nombre del mapa> <nuevo nombre>"
    description: "cambia el nombre de una imagen"
    quotes-hint: "&7Pon entre comillas los nombres con espacios: &f/maptool rename \"Nombre viejo\" \"Nombre nuevo\""
    invalid-name: "&cEl nombre no puede estar vacío."
    success: "&aLa imagen ahora se llama &6{0}&a (ID: {1})."
    prompt: "&eEscribe en el chat el nuevo nombre para &6{0}&e, o &fcancelar&e para dejarlo como está."
    cancelled: "&7El nombre no se ha cambiado."
  update:
    usage: "/maptool update [jugador:]<nombre del mapa> <nuevo enlace|file:nombre> [stretched|covered] [dither|nodither]"
    description: "dibuja otra imagen en los mismos mapas"
    invalid-mode: "&cModo desconocido. Usa stretched o covered, o nada para mantener las proporciones."
  delete:
    usage: "/maptool delete [jugador:]<nombre del mapa>"
    description: "elimina una imagen para siempre"
    confirm-prompt: "&f¿Eliminar &6{0}&f?"
    confirm-button: "&c&l[Sí, eliminar]"
    confirm-hover: "&cLa imagen y sus mapas no se podrán recuperar después."
    confirm-console: "&fPara eliminar &6{0}&f de verdad, ejecuta: &e{1}"
    success: "&aLa imagen se ha eliminado."
  import:
    usage: "/maptool import [carpeta]"
    description: "vuelve a importar las imágenes del antiguo ImageOnMap"
    start: "&7Leyendo los datos de ImageOnMap de &f{0}&7..."
    not-found: "&cNo hay datos de ImageOnMap en {0}."
    result: "&aImportación terminada: {0} archivos de jugadores leídos, {1} imágenes ({2} mapas) añadidas, {3} ya conocidas, {4} archivos de imagen copiados, {5} errores."
  reload:
    usage: "/maptool reload"
    description: "vuelve a cargar config.yml y los mensajes"
    done: "&aAjustes y mensajes recargados."
  info:
    usage: "/maptool info"
    description: "muestra la versión, el estado de las actualizaciones y estadísticas"
    header: "&8&m        &r &bImageOnMap&3Reborn &f{0} &8&m        "
    author: "&7Autor: &f{0}"
    images: "&7Imágenes: &f{0} &7(mapas: {1}, jugadores: {2})"
    uploads: "&7Imágenes en la carpeta upload: &f{0} &8(/tomap file:<nombre>)"
    limits: "&7Límites de mapas: &f{0} &7por jugador, &f{1} &7en el servidor"
    language: "&7Idioma: &f{0}"
    server: "&7Servidor: &f{0}"
    update-off: "&7Actualizaciones: &8la comprobación está desactivada"
    update-unknown: "&7Actualizaciones: &8todavía sin comprobar"
    update-latest: "&7Actualizaciones: &aal día"
    update-newer: "&7Actualizaciones: &aesta compilación es más nueva que la última versión ({0})"
    update-available: "&7Actualizaciones: &eha salido la versión &f{0}&e &8- &f{1}"

