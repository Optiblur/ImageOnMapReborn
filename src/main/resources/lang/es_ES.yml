  animation-too-heavy: "&eEste GIF tiene demasiados fotogramas grandes para animarlo, así que solo se usa su primer fotograma."

error:
  invalid-url: "ese enlace no parece válido."
  unsupported-protocol: "solo funcionan los enlaces que empiezan por http:// o https://."
