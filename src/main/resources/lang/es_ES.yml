# ImageOnMapReborn – Spanish messages.
# Color codes: &a, &c... (and &#RRGGBB). Placeholders: {0}, {1}...
# Keys missing from this file are taken from the version bundled with the plugin.

general:
  no-permission: "&cNo tienes permiso para hacer esto."
  player-only: "&cSolo los jugadores pueden usar este comando."
  player-not-found: "&cNo se encontró ningún jugador llamado {0}."
  player-not-online: "&c{0} no está conectado ahora mismo."
  map-not-found: "&cNo se encontró ninguna imagen con ese nombre."
  owner-required: "&cDesde la consola, añade también el dueño: <jugador>:<nombre del mapa>."
  unknown-subcommand: "&cEse subcomando no existe. Prueba &f/{0} help&c."
  usage: "&cCómo se usa: &f{0}"
  no-longer-allowed: "&cTus permisos han cambiado, esta acción ya no está disponible."
  inventory-overflow: "&eTu inventario está lleno, así que algunos mapas te están esperando. Usa &f/maptool getremaining&e para recogerlos."
  internal-error: "&cAlgo ha fallado en el servidor, los detalles están en la consola."

map:
  default-name: "Mapa"

item:
