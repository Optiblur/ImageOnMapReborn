    name: "&6{0}"
  part:
    name-grid: "&6{0} &7[fila {1}, col. {2}]"
    name-index: "&6{0} &7[pieza {1}]"
  splatter:
    name: "&6{0} &8| &ePóster &7{1}×{2}"
    lore:
      - "&8ID: {0}"
      - ""
      - "&9Tamaño"
      - "&7{1} de ancho, {2} de alto – {3} marcos"
      - ""
      - "&9Cómo colgarlo"
      - "&7Coloca marcos vacíos en una pared,"
      - "&7el suelo o el techo, tantos como indica"
      - "&7el tamaño. Haz clic derecho en el de abajo"
      - "&7a la izquierda con este objeto en la mano."
      - ""
      - "&9Cómo quitarlo"
      - "&7Agáchate y golpea cualquiera de sus mapas."

render:
  busy: "&cEspera, tu imagen anterior todavía se está procesando."
  started: "&2Preparando tu imagen..."
  finished: "&2¡Tu imagen está lista!"
  failed: "&cNo se pudo crear el mapa: {0}"
