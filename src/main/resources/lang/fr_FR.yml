command:
  help:
    header: "&6ImageOnMapReborn &7v{0} &8– &7commandes disponibles :"
    entry: "&f{0} &8– &7{1}"
  new:
    usage: "/tomap <lien|file:nom> [resize|resize-stretched|resize-covered] [largeur hauteur] [dither|nodither]"
    description: "transforme une image d'internet en cartes"
    no-url: "&cIndique le lien d'une image."
    invalid-mode: "&cMode inconnu. Choisis resize, resize-stretched ou resize-covered."
    invalid-size: "&cIndique la taille en cartes avec deux nombres (4 3), ou sous la forme 4x3 ou 4*3."
  list:
    usage: "/maptool list [joueur]"
    description: "affiche les images (clique sur une pour la recevoir)"
    none: "&7Il n'y a encore aucune image."
    header:
      one: "&f&l{0} image :"
      other: "&f&l{0} images :"
    hover: "&a&l{0}\n&7{1}, {2}\n\n&7Clique pour la recevoir"
    console-entry: "&f{0} &7– {1} ({2})"
    parts: "{0} morceaux"
  get:
    usage: "/maptool get [joueur:]<nom de la carte>"
    description: "te donne une copie d'une de tes images"
  getremaining:
    usage: "/maptool getremaining"
    description: "distribue les cartes qui ne tenaient pas dans ton inventaire"
    none: "&7Rien ne t'attend."
    inventory-full: "&cLibère d'abord de la place dans ton inventaire."
    remaining:
      one: "&7Il reste encore {0} carte qui t'attend."
      other: "&7Il reste encore {0} cartes qui t'attendent."
    done: "&aTu as tout récupéré."
  explore:
    usage: "/maps [joueur]"
    description: "ouvre le navigateur d'images"
  give:
    usage: "/givemap <joueur> [propriétaire:]<nom de la carte>"
    description: "donne une image à un joueur"
    success: "&a{1} a reçu &6{0}&a."
  rename:
    usage: "/maptool rename [joueur:]<nom de la carte> <nouveau nom>"
    description: "change le nom d'une image"
    quotes-hint: "&7Mets les noms avec des espaces entre guillemets : &f/maptool rename \"Ancien nom\" \"Nouveau nom\""
    invalid-name: "&cLe nom ne peut pas être vide."
    success: "&aL'image s'appelle maintenant &6{0}&a (ID : {1})."
    prompt: "&eÉcris le nouveau nom de &6{0}&e dans le chat, ou &fannuler&e pour le garder."
    cancelled: "&7Le nom n'a pas été changé."
  update:
    usage: "/maptool update [joueur:]<nom de la carte> <nouveau lien|file:nom> [stretched|covered] [dither|nodither]"
    description: "dessine une autre image sur les mêmes cartes"
    invalid-mode: "&cMode inconnu. Utilise stretched ou covered, ou rien pour garder les proportions."
  delete:
    usage: "/maptool delete [joueur:]<nom de la carte>"
    description: "supprime une image définitivement"
    confirm-prompt: "&fSupprimer &6{0}&f ?"
    confirm-button: "&c&l[Oui, supprimer]"
    confirm-hover: "&cL'image et ses cartes ne pourront plus être récupérées."
    confirm-console: "&fPour vraiment supprimer &6{0}&f, exécute : &e{1}"
    success: "&aL'image a été supprimée."
  import:
    usage: "/maptool import [dossier]"
    description: "importe à nouveau les images de l'ancien ImageOnMap"
    start: "&7Lecture des données d'ImageOnMap depuis &f{0}&7..."
    not-found: "&cIl n'y a aucune donnée d'ImageOnMap dans {0}."
    result: "&aImport terminé : {0} fichiers de joueurs lus, {1} images ({2} cartes) ajoutées, {3} déjà connues, {4} fichiers d'image copiés, {5} erreurs."
  reload:
    usage: "/maptool reload"
    description: "recharge config.yml et les messages"
    done: "&aParamètres et messages rechargés."
  info:
    usage: "/maptool info"
    description: "affiche la version, l'état des mises à jour et des statistiques"
    header: "&8&m        &r &bImageOnMap&3Reborn &f{0} &8&m        "
    author: "&7Auteur : &f{0}"
    images: "&7Images : &f{0} &7(cartes : {1}, joueurs : {2})"
    uploads: "&7Images dans le dossier upload : &f{0} &8(/tomap file:<nom>)"
    limits: "&7Limites de cartes : &f{0} &7par joueur, &f{1} &7sur le serveur"
    language: "&7Langue : &f{0}"
    server: "&7Serveur : &f{0}"
    update-off: "&7Mises à jour : &8la vérification est désactivée"
    update-unknown: "&7Mises à jour : &8pas encore vérifiées"
    update-latest: "&7Mises à jour : &aà jour"
    update-newer: "&7Mises à jour : &acette version est plus récente que la dernière publiée ({0})"
    update-available: "&7Mises à jour : &ela version &f{0}&e est sortie &8- &f{1}"

