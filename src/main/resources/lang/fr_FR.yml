# ImageOnMapReborn – French messages.
# Color codes: &a, &c... (and &#RRGGBB). Placeholders: {0}, {1}...
# Keys missing from this file are taken from the version bundled with the plugin.

general:
  no-permission: "&cTu n'as pas le droit de faire ça."
  player-only: "&cSeuls les joueurs peuvent utiliser cette commande."
